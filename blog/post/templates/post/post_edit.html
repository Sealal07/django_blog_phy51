{% extends 'base.html' %}
{% block title %}Редактирование{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <a href="{% url 'post_details' form.instance.id %}" class="inline-flex items-center text-slate-400 hover:text-sky-400 mb-6 transition-colors group">
        <span class="mr-2 group-hover:-translate-x-1 transition-transform">←</span> К просмотру поста
    </a>

    <div class="bg-slate-800/40 border border-slate-700 p-8 md:p-10 rounded-[2.5rem] shadow-2xl">
        <div class="flex items-center gap-4 mb-8 border-b border-slate-700/50 pb-6">
            <div class="w-12 h-12 bg-sky-500 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-sky-500/20">
                🛠️
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-tight">Редактировать</h1>
                <p class="text-slate-400 text-sm">Вносим правки в: <span class="text-sky-400 italic">"{{ form.instance.title }}"</span></p>
            </div>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div class="django-form-container">
                {% for field in form %}
                    <div class="flex flex-col gap-2 mb-4">
                        <label class="text-sm font-bold text-slate-400 ml-1">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}
            </div>

            <div class="grid grid-cols-2 gap-4 pt-4">
                <button type="submit" class="bg-sky-500 hover:bg-sky-400 text-slate-900 font-black py-4 rounded-2xl transition-all shadow-lg shadow-sky-500/20 cursor-pointer active:scale-95">
                    Сохранить изменения
                </button>
                <a href="{% url 'post_list' %}" class="bg-slate-700 hover:bg-slate-600 text-center font-bold py-4 rounded-2xl transition-all flex items-center justify-center">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
