{% extends 'base.html' %}
{% block title %}Настройка контента{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-black mb-8">Настройка контента</h1>
    <div class="bg-slate-800/50 p-8 rounded-3xl border border-slate-700">
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div class="form-styling text-slate-100">
                {{ form }}
                {% if u_form %}{{ u_form }}{% endif %}
                {% if p_form %}{{ p_form }}{% endif %}
            </div>

            <div class="flex items-center gap-4 pt-4">
                <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold px-8 py-3 rounded-2xl transition-all cursor-pointer">
                    Сохранить
                </button>
                <a href="{% url 'post_list' %}" class="text-slate-400 hover:text-white transition-colors">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
