<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | DEV FLOW</title>
</head>
<body>
    <nav>
        <div>
            <a href="{% url 'post_list' %}">
                DEVFLOW
            </a>
            <div>
                <a href="{% url 'post_list' %}">Лента</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}">Профиль</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'register' %}">
                        Регистрация
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
