<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | DEV FLOW</title>
    {% load static %}
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>

input, textarea, select {
    width: 100%;
    padding: 12px 16px;
    background-color: rgba(15, 23, 42, 0.5); /* bg-slate-900/50 */
    border: 1px solid #334155; /* border-slate-700 */
    border-radius: 12px;
    color: white;
    margin-top: 8px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
}

input:focus, textarea:focus {
    border-color: #10b981; /* border-emerald-500 */
}

label {
    font-weight: 600;
    font-size: 0.875rem;
    color: #94a3b8; /* text-slate-400 */
}
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans selection:bg-emerald-500/30">
    <nav class="sticky top-0 z-50 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="{% url 'post_list' %}" class="text-2xl font-black tracking-tighter text-emerald-400 hover:scale-105 transition-transform">
                DEV<span class="text-slate-100 ml-1">FLOW</span>
            </a>
            <div class="flex items-center gap-6 text-sm font-medium">
                <a href="{% url 'post_list' %}" class="hover:text-emerald-400 transition-colors">Лента</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="hover:text-emerald-400 transition-colors">Профиль</a>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 px-4 py-2 rounded-xl transition-all cursor-pointer">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="hover:text-emerald-400 transition-colors">Войти</a>
                    <a href="{% url 'register' %}" class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 px-4 py-2 rounded-xl transition-all font-bold">
                        Регистрация
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
